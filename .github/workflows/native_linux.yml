name: Linux build and packages

on:
  push:
    branches: [main]
    tags: [linux-v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-linux:
    name: Build ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            runtime: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Lint, format and analyze
        run: ./tools/lint-native.sh
      - name: Test native workspace and UI
        run: dotnet test tests/RonSijm.Slopsidian.Linux.Tests -c Release --no-build --no-restore --nologo
      - name: Package native client
        run: ./tools/package-linux.sh ${{ matrix.runtime }}
      - name: Check package version and contents
        shell: bash
        env:
          CLIENT_RUNTIME: ${{ matrix.runtime }}
        run: |
          expected_version="$(dotnet msbuild src/RonSijm.Slopsidian.Linux -nologo -getProperty:Version)"
          executable=".runtime/native-linux/$CLIENT_RUNTIME/publish/RonSijm.Slopsidian.Linux"
          test "$("$executable" --version)" = "$expected_version"
          "$executable" --help
          dpkg-deb --info .runtime/native-linux/"$CLIENT_RUNTIME"/out/*.deb
          test -z "$(find .runtime/native-linux/"$CLIENT_RUNTIME"/publish -iname '*electron*' -o -iname '*chromium*' -o -iname '*JSInterop*')"
          cd ".runtime/native-linux/$CLIENT_RUNTIME/out"
          sha256sum --check "SHA256SUMS-$CLIENT_RUNTIME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopsidian-linux-${{ matrix.runtime }}
          path: .runtime/native-linux/${{ matrix.runtime }}/out/*
          if-no-files-found: error
          retention-days: 14

  release-draft:
    name: Prepare a draft release
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: native-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: slopsidian-linux-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify checksums and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release-artifacts
          sha256sum --check SHA256SUMS-linux-x64.txt
          sha256sum --check SHA256SUMS-linux-arm64.txt
          cd ..
          client_version="${RELEASE_TAG#linux-v}"
          printf 'Slopsidian Linux %s\n\n' "$client_version" > release-notes.md
          awk -v heading="## $client_version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md >> release-notes.md
          cat >> release-notes.md <<'NOTES'
          Includes self-contained x64/arm64 archives, Debian packages and SHA-256 checksums.
          No compilation or .NET SDK installation is needed to use the app.

          See README.md and Docs/Features/NATIVE-ASSISTANT.md for setup and current capabilities.
          This remains a preview. Packages are unsigned and have no automatic update channel.
          NOTES
          prerelease=()
          if [[ "$client_version" == *-* ]]; then prerelease+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
            gh release edit "$RELEASE_TAG" --draft --title "Slopsidian Linux $client_version" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --draft "${prerelease[@]}" \
              --title "Slopsidian Linux $client_version" --notes-file release-notes.md
          fi
